apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sharath-portfolio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ksharath16/sharath-portfolio.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: server-deployment
      jsonPointers:
        - /spec/replicas
