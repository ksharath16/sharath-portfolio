---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: server
          image: ghcr.io/ksharath16/sharath-portfolio-server:latest
          ports:
            - containerPort: 4000
          resources:
            requests:
              cpu: "200m"
            limits:
              cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: server-service
spec:
  selector:
    app: server
  ports:
    - port: 4000
      targetPort: 4000
